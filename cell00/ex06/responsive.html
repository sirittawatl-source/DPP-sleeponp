<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            overflow-wrap: break-word;
        }

        td:first-child {
            background-color: pink;
        }

        td:last-child {
            background-color: lightblue;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td>Hello World</td>
            <td>Welcome to Piscine Web</td>
        </tr>
    </table>

</body>
</html>
