<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>
    <meta charset="UTF-8">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        table {
            width: 100%;
            height: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            overflow-wrap: break-word;
        }

        td:first-child {
            background-color: rgb(24, 137, 92);
        }

        td:last-child {
            background-color: rgb(179, 55, 158);
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>First Cell</td>
            <td>Second Cell</td>
        </tr>
    </table>
</body>
</html>
