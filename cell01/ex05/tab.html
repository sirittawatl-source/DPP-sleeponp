<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
</head>
<body>

    <table style="width: 100%; height: 200px; border-collapse: collapse;">
        <tr>
            <td style="background-color: rgb(24, 137, 92); border: 1px solid black;">
                First Cell
            </td>
            <td style="background-color: rgb(179, 55, 158); border: 1px solid black;">
                Second Cell
            </td>
        </tr>
    </table>

</body>
</html>
